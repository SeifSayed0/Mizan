let experiences=[];
let state={filter:'الكل',voted:null,experience:null,title:'',desc:'',a:'',b:'',cat:'علاقات',privacy:'مجهول للناس',search:'',loading:true};
const guestId=()=>{let id=localStorage.getItem('mizan_guest_id');if(!id){id='guest-'+crypto.randomUUID();localStorage.setItem('mizan_guest_id',id)}return id};
const catColors={علاقات:'#d85b68',دراسة:'#6c71d7',شغل:'#c58c41',فلوس:'#4e9b84',شراء:'#ca7568',سفر:'#538fb2','حياة شخصية':'#8476c0','أخرى':'#197862'};
function normalizeDecision(d){return {...d,cat:d.category,color:catColors[d.category]||'#197862',bg:'linear-gradient(135deg,#d8e9e4,#4e9486)',a:d.optionA,b:d.optionB,p:d.p==null?50:d.p,votes:d.votes||0,time:new Date(d.createdAt).toLocaleDateString('ar-EG'),author:'ضيف ميزان'}}
function normalizeExperience(e){return { ...e, initial:(e.name||'ض').slice(0,1),bg:'#d8e7df',meta:e.age?`ضيف ميزان · ${e.age} سنة`:'ضيف ميزان',result:e.outcome,likes:e.likes||0,comments:e.comments||0}}
async function api(path,options){if(location.protocol==='file:')throw new Error('افتح الموقع من رابط التشغيل، وليس ملف index.html مباشرة، حتى يعمل Supabase وتسجيل الدخول');try{const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options&&options.headers||{})},credentials:'include',...(options||{})});if(!r.ok){const raw=await r.text();let body=null;try{body=JSON.parse(raw)}catch{}if(r.status===404&&path.startsWith('/api/'))throw new Error('هذا الرابط منشور كواجهة فقط؛ يجب نشر السيرفر معه حتى يعمل النشر والتصويت');throw new Error(body?.error||'تعذر تنفيذ الطلب الآن')}return r.status===204?null:r.json()}catch(e){if(e instanceof TypeError)throw new Error('تعذر الاتصال بالسيرفر. افتح نسخة Full-Stack أو شغّل pnpm dev');throw e}}
async function loadData(){try{const rows=await api('/api/mizan/decisions?limit=50');decisions=rows.map(normalizeDecision);const details=await Promise.all(decisions.slice(0,12).map(d=>api('/api/mizan/decisions/'+d.id).catch(()=>null)));experiences=details.flatMap(x=>(x?.experiences||[]).map(normalizeExperience));}catch(e){console.error(e);toast('تعذر تحميل البيانات الآن')}finally{state.loading=false;render()}}
function go(route){location.hash=route.replace(/^#/,'')||'/'}
function searchInput(value){state.search=value;render();const input=document.querySelector('.search input');if(input){input.focus();input.setSelectionRange(value.length,value.length)}}
function toggleMenu(){const nav=document.querySelector('.nav');if(nav)nav.classList.toggle('open')}
function path(){return location.hash.slice(1)||location.pathname||'/'}
function toast(msg){const el=document.querySelector('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2400)}
function header(){let p=path();return `<header class="header"><div class="container header-inner"><a class="brand" href="#/"><span class="logo-mark">⚖</span><span><b class="brand-name">مِيزان</b><small class="brand-sub">شوف ناس عاشته</small></span></a><nav class="nav"><a class="${p==='/'?'active':''}" href="#/">${A.home} الرئيسية</a><a class="${p==='/explore'?'active':''}" href="#/explore">${A.explore} استكشف</a><a class="${p==='/profile'?'active':''}" href="#/profile">${A.profile} تجاربي</a><a class="${p==='/owner'?'active':''}" href="#/owner">⚙ لوحة المالك</a></nav><div class="actions"><div class="search">${A.search}<input placeholder="ابحث عن قرار..." value="${state.search||''}" oninput="searchInput(this.value)"></div><button class="icon" onclick="go('/notifications')">${A.bell}</button><span class="user-pill"><span class="avatar small">ض</span> ضيف</span><button class="btn" onclick="go('/create')">${A.create} اطرح قراراً</button><button class="icon mobile-menu" onclick="toggleMenu()">☰</button></div></div></header>`}
function bottom(){let p=path();return `<nav class="bottom"><button class="${p==='/'?'active':''}" onclick="go('/')">${A.home}<span>الرئيسية</span></button><button class="${p==='/explore'?'active':''}" onclick="go('/explore')">${A.explore}<span>استكشف</span></button><button class="new" onclick="go('/create')">＋<span>قرار</span></button><button class="${p==='/notifications'?'active':''}" onclick="go('/notifications')">${A.bell}<span>الإشعارات</span></button><button class="${p==='/profile'?'active':''}" onclick="go('/profile')">${A.profile}<span>حسابي</span></button></nav>`}
function art(d,cls='art'){return `<div class="${cls}" style="background:${d.bg}"><i class="sun"></i><i class="horizon"></i><i class="person"></i></div>`}
function visibleDecisions(){const q=(state.search||'').trim().toLowerCase();const list=state.filter==='الكل'?decisions:decisions.filter(d=>d.cat===state.filter);return q?list.filter(d=>(d.title+' '+d.description+' '+d.cat).toLowerCase().includes(q)):list}
function categoryStrip(){return `<div class="categories">${cats.map(([n,i])=>`<button class="chip ${state.filter===n?'active':''}" onclick="state.filter='${n}';render()">${i} ${n}</button>`).join('')}</div>`}
function miniCard(d){return `<button class="card" style="text-align:right;width:100%;padding:0" onclick="go('/decision/${d.id}')">${art(d)}<div class="card-body"><div class="meta"><span style="color:${d.color}">${d.cat}</span><span>${d.time}</span></div><h3 class="title">${d.title}</h3><div class="votes"><span class="good">${d.p}% ${d.a}</span><span class="bad">${100-d.p}% ${d.b}</span></div><div class="bar"><i style="width:${d.p}%"></i></div><div class="foot"><span>${A.users} ${d.votes} رأي</span><span>التفاصيل ${A.arrow}</span></div></div></button>`}
function experience(e,featured=false){return `<article class="experience"><div class="person-head"><div class="person-info"><span class="avatar" style="background:${e.bg}">${e.initial}</span><span><strong>${e.name} ✓</strong><small>${e.meta}</small></span></div><button class="icon">${A.more}</button></div><h3>${e.title}</h3><p>${e.body}</p><span class="result ${e.result==='فشلت'?'fail':''}">${e.result==='نجحت'?A.check:'!'} ${e.result}</span><div class="foot"><span>♡ ${e.likes}　◌ ${e.comments}</span></div>${featured?`<div class="experience-foot"><span>★ تجربة مفيدة</span><button style="background:transparent;color:var(--green);font-weight:800">اسمع التجربة ${A.mic}</button></div>`:''}</article>`}
function hero(){return `<section class="hero"><i class="orb one"></i><i class="orb two"></i><div class="hero-content"><span class="eyebrow">${A.spark} مساحة آمنة للقرارات المهمة</span><h1 class="display">قرارك مش لازم<br><span>تاخده لوحدك.</span></h1><p>اسأل ناس عاشوا نفس موقفك، شوف الأسباب والتجارب، وخد قرارك وأنت شايف الصورة كاملة.</p><div class="hero-actions"><button class="btn light" onclick="go('/create')">＋ اطرح قرارك الآن</button><button class="ghost" onclick="go('/explore')">◉ استكشف القرارات</button></div><div class="hero-meta"><span>● ${decisions.length} قرار منشور</span><span>⌾ ${experiences.length} تجربة منشورة</span></div></div><div class="hero-scale"><i class="scale-head"></i><i class="scale-beam"></i><i class="scale-stand"></i><i class="pan left"></i><i class="pan right"></i></div></section>`}
function home(){let filtered=visibleDecisions();return `<main class="container main-pad">${hero()}<section class="section"><div class="section-head"><div><div class="eyebrow">الآن على ميزان</div><h2>قرارات نشطة</h2></div><button class="section-link" onclick="go('/explore')">عرض الكل ${A.arrow}</button></div>${categoryStrip()}<div class="grid4">${filtered.slice(0,4).map(miniCard).join('')||'<div class="empty" style="grid-column:1/-1"><h3>لسه مفيش قرارات منشورة</h3><p>ابدأ أول قرار حقيقي على ميزان.</p></div>'}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">من قلب التجربة</div><h2>تجارب الناس</h2></div></div><div class="experiences">${experiences.slice(0,2).map(e=>experience(e,true)).join('')||'<div class="empty" style="grid-column:1/-1"><h3>لسه مفيش تجارب</h3><p>شارك تجربتك بعد ما تاخد قرارك.</p></div>'}</div></section><section class="section"><div class="banner"><div><div class="eyebrow" style="color:#9fd0bd">↗ لماذا ميزان؟</div><h2>كل قرار هنا يترك أثرًا.</h2><p>مش مجرد رأي سريع. مع كل نتيجة وتجربة، بنبني ذاكرة تساعدك تشوف الصورة أوضح.</p></div><button class="btn" onclick="go('/create')">ابدأ بقرارك ${A.arrow}</button></div></section></main>`}
function listCard(d){return `<button class="list-card" onclick="go('/decision/${d.id}')" style="text-align:right;width:100%;padding:0">${art(d,'list-art art')}<div class="card-body"><div class="meta"><span style="color:${d.color}">● ${d.cat}</span><span>${d.time}</span></div><h3 class="title">${d.title}</h3><div class="votes"><span class="good">${d.p}% ${d.a}</span><span class="bad">${100-d.p}% ${d.b}</span></div><div class="bar"><i style="width:${d.p}%"></i></div><div class="foot"><span>${A.users} ${d.votes} تجربة</span><span>›</span></div></div></button>`}
function explore(){let filtered=visibleDecisions();return `<main class="container main-pad"><div class="page-title"><div class="eyebrow">استكشف بصوت هادي</div><h1>قرارات ناس حقيقية،<br><span>وتجارب تستاهل تتسمع.</span></h1><p>اختار موضوع قريب منك، شوف التصويت، واقرأ الأسباب اللي ما بتبانش في السؤال الأول.</p></div><div class="toolbar"><b style="font-size:12px">☷ تصفية القرارات</b>${categoryStrip()}</div><div class="list-grid">${filtered.map(listCard).join('')}</div><div id="experiences" class="section"><div class="section-head"><div><div class="eyebrow">من تجاربهم</div><h2>ممكن تلاقي نفسك هنا</h2></div></div><div class="experiences">${experiences.map(e=>experience(e,true)).join('')}</div></div></main>`}
function create(){return `<main class="container main-pad"><button class="back" onclick="go('/')">${A.back} رجوع</button><div class="create-layout" style="margin-top:28px"><div><div class="eyebrow">قرار جديد</div><h1 class="display" style="font-size:clamp(34px,5vw,48px);line-height:1.4;letter-spacing:-.06em;margin:0">احكي لنا،<br><span style="color:#21866b">إيه اللي محيّرك؟</span></h1><p style="max-width:530px;color:#718981;line-height:2;font-size:14px">خلي سؤالك واضح ومن غير ضغط. الناس هنا هتساعدك تشوف زوايا جديدة، مش تاخد القرار مكانك.</p><div class="form"><label>عنوان القرار<input class="input" value="${state.title}" oninput="state.title=this.value;updatePreview()" placeholder="مثال: أسيب شغلي وأسافر؟"></label><label>احكي شوية عن الموقف <span style="color:#9eb0aa;font-weight:400">(اختياري)</span><textarea class="textarea" oninput="state.desc=this.value;updatePreview()" placeholder="إيه اللي حصل؟ وإيه أهم حاجة محتار فيها؟">${state.desc}</textarea></label><label>نوع القرار<div class="selection-grid">${cats.slice(1).map(([n,i])=>`<button class="selection ${state.cat===n?'active':''}" onclick="state.cat='${n}';render()">${i} ${n}</button>`).join('')}</div></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>الاختيار الأول<input class="input" value="${state.a}" oninput="state.a=this.value;updatePreview()" placeholder="مثال: أسيب"></label><label>الاختيار الثاني<input class="input" value="${state.b}" oninput="state.b=this.value;updatePreview()" placeholder="مثال: أستمر"></label></div><label>الخصوصية<div class="privacy-grid">${['عام','مجهول للناس','خاص برابط'].map(x=>`<button class="privacy ${state.privacy===x?'active':''}" onclick="state.privacy='${x}';render()">${x==='عام'?'♧':x==='مجهول للناس'?'◉':'⌾'} ${x} ${state.privacy===x?'✓':''}</button>`).join('')}</div></label><button class="btn" style="width:100%;margin-top:20px;border-radius:12px" onclick="publish()">نشر القرار ${A.arrow}</button></div></div><div class="preview"><div style="font-size:11px;color:#7d9890;margin-bottom:10px">معاينة القرار</div><div class="preview-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span class="logo-mark">⚖</span><span style="color:#8ca29c">${A.more}</span></div>${art(decisions[0]||{bg:'linear-gradient(135deg,#d8e9e4,#4e9486)'},'preview-image')}<span class="tag" style="margin-top:15px;display:inline-block">${state.cat}</span><h3 id="prevTitle" style="font-size:18px;margin:12px 0 5px">${state.title||'هل أرجع أكلم الشخص ده؟'}</h3><p id="prevDesc" style="margin:0;color:#80968f;font-size:11px;line-height:2">${state.desc||'اكتب تفاصيل صغيرة تساعد الناس تفهم الصورة كاملة.'}</p><div class="choice-grid"><span id="prevA" class="choice">${state.a||'الاختيار الأول'}</span><span id="prevB" class="choice">${state.b||'الاختيار الثاني'}</span></div><div style="margin-top:15px;color:#94aaa3;font-size:10px">◉ ${state.privacy}</div></div></div></div></main>`}
function updatePreview(){['Title','Desc','A','B'].forEach((k,i)=>{const el=document.querySelector('#prev'+k);if(el)el.textContent=[state.title||'هل أرجع أكلم الشخص ده؟',state.desc||'اكتب تفاصيل صغيرة تساعد الناس تفهم الصورة كاملة.',state.a||'الاختيار الأول',state.b||'الاختيار الثاني'][i]})}
async function publish(){if(state.title.trim().length<8)return toast('عنوان القرار لازم يكون 8 أحرف على الأقل');if(!state.a.trim()||!state.b.trim())return toast('اكتب الاختيارين أولاً');try{const d=await api('/api/mizan/decisions',{method:'POST',body:JSON.stringify({guestId:guestId(),title:state.title,description:state.desc,category:state.cat,privacy:state.privacy,optionA:state.a,optionB:state.b})});toast('اتنشر قرارك بنجاح');await loadData();go('/decision/'+d.id)}catch(e){toast(e.message||'تعذر نشر القرار الآن')}}
async function continueExperience(id){if(!state.experience)return toast('اختار نوع تجربتك الأول');const title=window.prompt('اكتب عنوانًا مختصرًا لتجربتك');if(!title)return;const body=window.prompt('احكِ تجربتك في 20 حرفًا على الأقل');if(!body||body.trim().length<20)return toast('اكتب تفاصيل أطول قليلًا');try{await api('/api/mizan/experiences',{method:'POST',body:JSON.stringify({decisionId:id,guestId:guestId(),name:'ضيف ميزان',title:title.trim(),body:body.trim(),outcome:state.experience})});toast('تم نشر تجربتك');await loadData();render()}catch(e){toast('تعذر نشر التجربة: '+(e.message||'تحقق من البيانات'))}}
function shareDecision(id){const url=location.origin+location.pathname+'#/decision/'+id;if(navigator.share)navigator.share({title:'قرار على ميزان',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('تم نسخ رابط القرار')).catch(()=>toast(url))}
function toggleBookmark(id){const key='mizan_bookmarks';const items=JSON.parse(localStorage.getItem(key)||'[]');const next=items.includes(id)?items.filter(x=>x!==id):[...items,id];localStorage.setItem(key,JSON.stringify(next));toast(next.includes(id)?'تم حفظ القرار':'تم إلغاء الحفظ')}
function decision(id){let d=decisions.find(x=>x.id===id);if(!d)return `<main class="container main-pad"><div class="empty"><h2>القرار غير موجود</h2><button class="btn" onclick="go('/explore')">العودة للاستكشاف</button></div></main>`;return `<main class="container main-pad"><button class="back" onclick="go('/explore')">${A.back} كل القرارات</button><div class="decision-layout" style="margin-top:26px"><div class="detail"><div class="detail-cover" style="background:${d.bg}"><i class="sun"></i><i class="horizon"></i><i class="person"></i><div class="cover-tools"><button onclick="shareDecision('${d.id}')">${A.share}</button><button onclick="toggleBookmark('${d.id}')">${A.bookmark}</button></div></div><div class="detail-body"><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="color:${d.color}">${d.cat}</span><small style="color:#8fa59e">${d.privacy||'مجهول للناس'}</small></div><h1>${d.title}</h1><p>${d.description||'شارك رأيك بهدوء وساعد صاحب القرار يشوف الصورة أوضح.'}</p><div class="poll"><div class="poll-head"><span>إيه رأيك؟</span><small>${d.votes} شخص صوتوا</small></div><button class="poll-option ${state.voted==='a'?'selected':''}" onclick="vote('${d.id}','a')"><span><i class="radio"></i>${d.a}</span></button><button class="poll-option ${state.voted==='b'?'selected':''}" onclick="vote('${d.id}','b')"><span><i class="radio"></i>${d.b}</span></button><small style="display:block;color:#91a59e;font-size:10px;margin-top:14px">◉ تصويتك مجهول، وممكن تعدّله في أي وقت</small></div></div></div><aside class="side"><div class="side-card"><h2>هل مررت بتجربة مشابهة؟</h2><p>خلّي صاحب القرار يشوف رأي الناس اللي عاشوا نفس الموقف.</p>${['نجحت','فشلت','قريبة منها','رأي فقط'].map(x=>`<button class="experience-choice ${state.experience===x?'active':''}" onclick="state.experience='${x}';render()"><i class="radio"></i>${x}</button>`).join('')}<button class="btn" style="width:100%;margin-top:15px;border-radius:11px;font-size:12px" onclick="continueExperience('${d.id}')">كمل تجربتك ${A.arrow}</button></div><div class="side-card"><h2 style="margin-bottom:15px">ناس عاشوا التجربة</h2>${experiences.filter(e=>e.decisionId===d.id).map(e=>experience(e)).join('')||'<p>لسه مفيش تجارب منشورة.</p>'}</div></aside></div></main>`}
async function vote(id,choice){try{await api('/api/mizan/votes',{method:'POST',body:JSON.stringify({decisionId:id,guestId:guestId(),choice,experienceRelation:state.experience||undefined})});state.voted=choice;toast('اتسجل صوتك بشكل مجهول');render()}catch(e){toast(e.message||'تعذر تسجيل الصوت الآن')}}
function profile(){return `<main class="container main-pad"><div class="profile-hero"><div class="profile-top"><div class="profile-user"><span class="avatar avatar-xl">ض</span><div><small style="color:#b0d9ca">✓ زائر مجهول</small><h1>ضيف ميزان</h1><p>كل زائر له Guest ID خاص بدون تسجيل دخول.</p></div></div><button class="edit" onclick="go('/create')">＋ قرار جديد</button></div><div class="stats"><div><strong>${decisions.length}</strong><small>قرارات</small></div><div><strong>${experiences.length}</strong><small>تجارب</small></div><div><strong>Guest</strong><small>نوع الحساب</small></div></div></div><div class="tabs"><button class="tab active">القرارات المنشورة</button><button class="tab" onclick="go('/create')" style="margin-right:auto;color:var(--green)">＋ قرار جديد</button></div><div class="list-grid" style="grid-template-columns:repeat(2,1fr);margin-top:23px">${decisions.slice(0,3).map(listCard).join('')||'<div class="empty" style="grid-column:1/-1"><h3>لم تنشر أي قرار بعد</h3><p>ابدأ بكتابة أول قرار لك.</p><button class="btn" onclick="go(\'/create\')">إضافة قرار</button></div>'}</div></main>`}
function notif(){return `<main class="container main-pad" style="max-width:780px"><div class="page-title"><div class="eyebrow">التنبيهات</div><h1 class="display" style="font-size:40px;margin:0;letter-spacing:-.06em">الإشعارات</h1><p>لا توجد إشعارات بعد. ستظهر هنا التحديثات المتعلقة بقراراتك.</p></div><div class="empty"><div class="empty-icon">♧</div><h3>لا توجد إشعارات</h3><p style="color:#829991;font-size:11px">ستظهر التحديثات هنا عند وجود نشاط جديد.</p></div></main>`}
function owner(){return `<main class="container main-pad"><div class="page-title"><div class="eyebrow">تحكم آمن</div><h1>لوحة <span>المالك</span></h1><p>إدارة القرارات والتجارب المنشورة. الزوار لا يحتاجون إلى تسجيل دخول.</p></div><div id="ownerPanel" class="empty"><p>جارٍ التحقق من صلاحية المالك...</p></div></main>`}
async function loadOwner(){const el=document.querySelector('#ownerPanel');if(!el)return;try{const data=await api('/api/mizan/owner');el.className='owner-grid';el.innerHTML=`<div class="side-card"><h2>القرارات (${data.decisions.length})</h2>${data.decisions.map(d=>`<article class="soft"><div><b>${d.title}</b><small style="display:block;color:#829991">${d.category} · ${d.status}</small></div><button class="btn" style="padding:7px 11px" onclick="removeOwnerDecision('${d.id}')">حذف</button></article>`).join('')||'<p>لا توجد قرارات.</p>'}</div><div class="side-card"><h2>التجارب (${data.experiences.length})</h2>${data.experiences.map(e=>`<article class="soft"><div><b>${e.title}</b><small style="display:block;color:#829991">${e.outcome} · ${e.status}</small></div><button class="btn" style="padding:7px 11px" onclick="removeOwnerExperience('${e.id}')">حذف</button></article>`).join('')||'<p>لا توجد تجارب.</p>'}</div>`}catch(e){el.className='empty';el.innerHTML=e.message.includes('تسجيل')?'<h3>دخول المالك مطلوب</h3><p>الزوار يظلون Guest بدون تسجيل.</p><a class="btn" href="/api/mizan/owner-login">دخول المالك</a>':'<h3>لا تملك صلاحية هذه الصفحة</h3><p>تأكد أنك دخلت بحساب المالك.</p>'}}
async function removeOwnerDecision(id){if(!confirm('حذف القرار وكل التصويتات والتجارب المرتبطة؟'))return;await api('/api/mizan/owner/decisions/'+id,{method:'DELETE'});toast('تم حذف القرار');await loadData()}
async function removeOwnerExperience(id){if(!confirm('حذف التجربة؟'))return;await api('/api/mizan/owner/experiences/'+id,{method:'DELETE'});toast('تم حذف التجربة');await loadOwner()}
function render(){const p=path().split(/[?#]/)[0];let content=state.loading?'<main class="container main-pad"><div class="empty"><h3>جارٍ تحميل ميزان...</h3></div></main>':p==='/'?home():p==='/explore'?explore():p==='/create'?create():p==='/profile'?profile():p==='/notifications'?notif():p==='/owner'?owner():p.startsWith('/decision/')?decision(p.split('/')[2]):home();document.querySelector('#app').innerHTML=header()+content+bottom();updatePreview();if(p==='/owner'&&!state.loading)loadOwner();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',()=>{render();loadData()});if(!location.hash && (location.pathname==='/' || location.pathname===''))location.hash='/';
</script>
</body>
</html>
